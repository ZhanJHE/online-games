<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>俄罗斯方块 · RK的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  :root { --accent: #B4626B; }

  #board {
    display: block;
    width: 240px;
    max-width: 68vw;
    height: auto;
    aspect-ratio: 1 / 2;
    background: #FBF7EF;
  }
</style>
</head>
<body>

<div class="page page--game">
  <header class="game-top">
    <a class="back" href="../index.html">← 返回</a>
    <span class="game-title">俄罗斯方块</span>
    <span class="game-tag">TETRIS</span>
  </header>

  <div class="hud">
    <span>分数<b id="score">0</b></span>
    <span>消行<b id="lines">0</b></span>
    <span>最高<b id="best">0</b></span>
    <button class="btn btn-sm ghost" id="restart" type="button">重开</button>
  </div>

  <main class="game-main">
    <div class="stage">
      <canvas id="board" width="240" height="480" aria-label="俄罗斯方块棋盘"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="ovTitle">游戏结束</div>
          <div class="overlay-text" id="ovText">再来一局？</div>
          <button class="btn" id="ovBtn" type="button">重新开始</button>
        </div>
      </div>
    </div>

    <div class="pad pad-4">
      <button data-act="left" type="button" aria-label="左移">←</button>
      <button data-act="rotate" type="button" aria-label="旋转">⟳</button>
      <button data-act="right" type="button" aria-label="右移">→</button>
      <button data-act="drop" type="button" aria-label="直接落下">⤓</button>
    </div>
  </main>

  <p class="game-tip">← → 移动 · ↓ 加速 · ↑ 或 ⟳ 旋转 · 空格直接落下</p>
</div>

<script>
(function () {
  "use strict";

  var COLS = 10, ROWS = 20, CELL = 24;
  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = COLS * CELL * dpr;
  canvas.height = ROWS * CELL * dpr;
  canvas.style.width = COLS * CELL + "px";
  ctx.scale(dpr, dpr);

  var SHAPES = {
    I: [[1, 1, 1, 1]],
    O: [[1, 1], [1, 1]],
    T: [[0, 1, 0], [1, 1, 1]],
    S: [[0, 1, 1], [1, 1, 0]],
    Z: [[1, 1, 0], [0, 1, 1]],
    J: [[1, 0, 0], [1, 1, 1]],
    L: [[0, 0, 1], [1, 1, 1]]
  };
  var COLORS = {
    I: "#B08D57", O: "#D9A94E", T: "#8E7BA6",
    S: "#5D7F6A", Z: "#B4626B", J: "#5F8FA8", L: "#C87B96"
  };
  var KEYS = Object.keys(SHAPES);

  var board, piece, score, lines, dropTimer, dropInterval, lastTime, over, best;

  var elScore = document.getElementById("score");
  var elLines = document.getElementById("lines");
  var elBest = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovText = document.getElementById("ovText");

  function readBest() {
    try { return parseInt(localStorage.getItem("tetris.best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("tetris.best", String(v)); } catch (e) {}
  }

  function emptyBoard() {
    var b = [];
    for (var y = 0; y < ROWS; y++) {
      b.push(new Array(COLS).fill(null));
    }
    return b;
  }

  function spawn() {
    var k = KEYS[Math.floor(Math.random() * KEYS.length)];
    var shape = SHAPES[k].map(function (row) { return row.slice(); });
    piece = {
      key: k,
      shape: shape,
      x: Math.floor((COLS - shape[0].length) / 2),
      y: 0
    };
    if (collide(piece.shape, piece.x, piece.y)) {
      gameOver();
    }
  }

  function collide(shape, px, py) {
    for (var y = 0; y < shape.length; y++) {
      for (var x = 0; x < shape[y].length; x++) {
        if (!shape[y][x]) continue;
        var nx = px + x, ny = py + y;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
    }
    return false;
  }

  function rotateMatrix(m) {
    var h = m.length, w = m[0].length;
    var out = [];
    for (var x = 0; x < w; x++) {
      var row = [];
      for (var y = h - 1; y >= 0; y--) row.push(m[y][x]);
      out.push(row);
    }
    return out;
  }

  function rotate() {
    if (over) return;
    var r = rotateMatrix(piece.shape);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collide(r, piece.x + kicks[i], piece.y)) {
        piece.shape = r;
        piece.x += kicks[i];
        draw();
        return;
      }
    }
  }

  function move(dx) {
    if (over) return;
    if (!collide(piece.shape, piece.x + dx, piece.y)) {
      piece.x += dx;
      draw();
    }
  }

  function step() {
    if (over) return;
    if (!collide(piece.shape, piece.x, piece.y + 1)) {
      piece.y++;
    } else {
      merge();
      clearLines();
      spawn();
    }
    draw();
  }

  function merge() {
    for (var y = 0; y < piece.shape.length; y++) {
      for (var x = 0; x < piece.shape[y].length; x++) {
        if (!piece.shape[y][x]) continue;
        var ny = piece.y + y, nx = piece.x + x;
        if (ny >= 0) board[ny][nx] = piece.key;
      }
    }
  }

  function clearLines() {
    var cleared = 0;
    for (var y = ROWS - 1; y >= 0; y--) {
      var full = board[y].every(function (c) { return c; });
      if (full) {
        board.splice(y, 1);
        board.unshift(new Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared) {
      var table = [0, 100, 300, 500, 800];
      var level = 1 + Math.floor(lines / 10);
      score += table[cleared] * level;
      lines += cleared;
      dropInterval = Math.max(120, 800 - (lines * 22));
      updateHud();
    }
  }

  function hardDrop() {
    if (over) return;
    while (!collide(piece.shape, piece.x, piece.y + 1)) piece.y++;
    step();
  }

  function updateHud() {
    elScore.textContent = score;
    elLines.textContent = lines;
    if (score > best) {
      best = score;
      saveBest(best);
    }
    elBest.textContent = best;
  }

  function draw() {
    ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
    ctx.fillStyle = "#FBF7EF";
    ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

    ctx.strokeStyle = "rgba(43,37,51,.06)";
    ctx.lineWidth = 1;
    for (var x = 1; x < COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL + .5, 0);
      ctx.lineTo(x * CELL + .5, ROWS * CELL);
      ctx.stroke();
    }
    for (var y = 1; y < ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL + .5);
      ctx.lineTo(COLS * CELL, y * CELL + .5);
      ctx.stroke();
    }

    for (var yy = 0; yy < ROWS; yy++) {
      for (var xx = 0; xx < COLS; xx++) {
        if (board[yy][xx]) block(xx, yy, COLORS[board[yy][xx]]);
      }
    }

    if (piece && !over) {
      for (var py = 0; py < piece.shape.length; py++) {
        for (var px = 0; px < piece.shape[py].length; px++) {
          if (piece.shape[py][px]) block(piece.x + px, piece.y + py, COLORS[piece.key]);
        }
      }
    }
  }

  function block(x, y, color) {
    if (y < 0) return;
    var px = x * CELL, py = y * CELL;
    ctx.fillStyle = color;
    ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(px + 1, py + 1, CELL - 2, 4);
    ctx.strokeStyle = "rgba(43,37,51,.35)";
    ctx.lineWidth = 1;
    ctx.strokeRect(px + .5, py + .5, CELL - 1, CELL - 1);
  }

  function gameOver() {
    over = true;
    ovTitle.textContent = "堆到顶了";
    ovText.textContent = "这一局 " + score + " 分，消了 " + lines + " 行";
    overlay.classList.add("show");
  }

  function reset() {
    board = emptyBoard();
    score = 0;
    lines = 0;
    over = false;
    dropInterval = 800;
    dropTimer = 0;
    lastTime = 0;
    overlay.classList.remove("show");
    best = readBest();
    elBest.textContent = best;
    spawn();
    updateHud();
    draw();
  }

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    var dt = ts - lastTime;
    lastTime = ts;
    // 切标签回来时 dt 会很大，截断避免方块瞬移
    if (dt > 200) dt = 200;
    if (!over) {
      dropTimer += dt;
      if (dropTimer >= dropInterval) {
        dropTimer = 0;
        step();
      }
    }
    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft") { e.preventDefault(); move(-1); }
    else if (k === "ArrowRight") { e.preventDefault(); move(1); }
    else if (k === "ArrowDown") { e.preventDefault(); step(); }
    else if (k === "ArrowUp") { e.preventDefault(); rotate(); }
    else if (k === " ") { e.preventDefault(); hardDrop(); }
  });

  document.querySelectorAll(".pad button").forEach(function (b) {
    b.addEventListener("click", function () {
      var act = b.dataset.act;
      if (act === "left") move(-1);
      else if (act === "right") move(1);
      else if (act === "rotate") rotate();
      else if (act === "drop") hardDrop();
    });
  });

  document.getElementById("restart").addEventListener("click", reset);
  document.getElementById("ovBtn").addEventListener("click", reset);

  document.addEventListener("visibilitychange", function () {
    lastTime = 0;
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
