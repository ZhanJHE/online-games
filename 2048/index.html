<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>2048 · RK的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  :root { --accent: #D9A94E; }

  .board-2048 {
    position: relative;
    width: 320px;
    max-width: 78vw;
    aspect-ratio: 1;
    padding: 8px;
    background: var(--paper-2);
    border-radius: 2px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    touch-action: none;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    background: rgba(255, 252, 246, .55);
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    color: var(--ink);
    transition: background .12s ease, color .12s ease;
    user-select: none;
  }
  .v2    { background: #F3E9D8; }
  .v4    { background: #EBDCC1; }
  .v8    { background: #DFC49B; }
  .v16   { background: #D9A94E; color: #FFFDF8; }
  .v32   { background: #D08F3E; color: #FFFDF8; }
  .v64   { background: #C87B61; color: #FFFDF8; }
  .v128  { background: #B4626B; color: #FFFDF8; font-size: 22px; }
  .v256  { background: #A05360; color: #FFFDF8; font-size: 22px; }
  .v512  { background: #8C4A5E; color: #FFFDF8; font-size: 22px; }
  .v1024 { background: #7E7BA6; color: #FFFDF8; font-size: 18px; }
  .v2048 { background: #6C6795; color: #FFFDF8; font-size: 18px; }
  .vBig  { background: #5D7F6A; color: #FFFDF8; font-size: 17px; }
  .pop { animation: pop .18s ease; }
  .merge { animation: merge .24s cubic-bezier(.16, 1, .3, 1); }
  @keyframes pop {
    from { transform: scale(.86); }
    to { transform: scale(1); }
  }
  @keyframes merge {
    0% { transform: scale(1); }
    45% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="page page--game">
  <header class="game-top">
    <a class="back" href="../index.html">← 返回</a>
    <span class="game-title">2048</span>
    <span class="game-tag">2048</span>
  </header>

  <div class="hud">
    <span>分数<b id="score">0</b></span>
    <span>最高<b id="best">0</b></span>
    <button class="btn btn-sm ghost" id="restart" type="button">重开</button>
  </div>

  <main class="game-main">
    <div class="stage">
      <div class="board-2048" id="board"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="ovTitle">没有可走的方向了</div>
          <div class="overlay-text" id="ovText">再来一局？</div>
          <button class="btn" id="ovBtn" type="button">重新开始</button>
        </div>
      </div>
    </div>

    <div class="pad pad-4">
      <button data-dir="left" type="button" aria-label="左">←</button>
      <button data-dir="up" type="button" aria-label="上">↑</button>
      <button data-dir="down" type="button" aria-label="下">↓</button>
      <button data-dir="right" type="button" aria-label="右">→</button>
    </div>
  </main>

  <p class="game-tip">方向键或滑动 · 相同数字撞在一起会合并 · 凑到 2048 算赢</p>
</div>

<script>
(function () {
  "use strict";

  var SIZE = 4;
  var board, score, best, won, over, busy;
  var newAt = [];      // 刚生成的块，播入场动画
  var mergedAt = [];   // 刚合并出来的块，播放大动画

  var elBoard = document.getElementById("board");
  var elScore = document.getElementById("score");
  var elBest = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovText = document.getElementById("ovText");
  var ovBtn = document.getElementById("ovBtn");

  function readBest() {
    try { return parseInt(localStorage.getItem("2048.best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("2048.best", String(v)); } catch (e) {}
  }

  function blank() {
    var b = [];
    for (var r = 0; r < SIZE; r++) b.push(new Array(SIZE).fill(0));
    return b;
  }

  function emptyCells() {
    var list = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!board[r][c]) list.push([r, c]);
    return list;
  }

  function addTile() {
    var cells = emptyCells();
    if (!cells.length) return;
    var p = cells[Math.floor(Math.random() * cells.length)];
    board[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
    newAt.push(p);
  }

  function cls(v) {
    if (v === 2) return "v2";
    if (v === 4) return "v4";
    if (v === 8) return "v8";
    if (v === 16) return "v16";
    if (v === 32) return "v32";
    if (v === 64) return "v64";
    if (v === 128) return "v128";
    if (v === 256) return "v256";
    if (v === 512) return "v512";
    if (v === 1024) return "v1024";
    if (v === 2048) return "v2048";
    return "vBig";
  }

  function has2(list, r, c) {
    for (var i = 0; i < list.length; i++) {
      if (list[i][0] === r && list[i][1] === c) return true;
    }
    return false;
  }

  function render() {
    elBoard.innerHTML = "";
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var d = document.createElement("div");
        var v = board[r][c];
        d.className = "cell" + (v ? " " + cls(v) : "");
        if (v && has2(mergedAt, r, c)) d.classList.add("merge");
        else if (v && has2(newAt, r, c)) d.classList.add("pop");
        d.textContent = v ? v : "";
        elBoard.appendChild(d);
      }
    }
    elScore.textContent = score;
    if (score > best) { best = score; saveBest(best); }
    elBest.textContent = best;
  }

  /* 把棋盘按行进方向读成若干条线，压缩合并后再写回去 */
  function lines(dir) {
    var out = [];
    for (var i = 0; i < SIZE; i++) {
      var line = [];
      for (var j = 0; j < SIZE; j++) {
        var r, c;
        if (dir === "left") { r = i; c = j; }
        else if (dir === "right") { r = i; c = SIZE - 1 - j; }
        else if (dir === "up") { r = j; c = i; }
        else { r = SIZE - 1 - j; c = i; }
        line.push([r, c]);
      }
      out.push(line);
    }
    return out;
  }

  function move(dir) {
    if (busy || over) return;
    var moved = false;

    newAt = [];
    mergedAt = [];

    lines(dir).forEach(function (line) {
      var vals = line.map(function (p) { return board[p[0]][p[1]]; }).filter(function (v) { return v; });
      var merged = [];
      for (var i = 0; i < vals.length; i++) {
        if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
          var sum = vals[i] * 2;
          merged.push(sum);
          mergedAt.push(line[merged.length - 1]);
          score += sum;
          if (sum === 2048 && !won) { won = true; }
          i++;
        } else {
          merged.push(vals[i]);
        }
      }
      while (merged.length < SIZE) merged.push(0);

      line.forEach(function (p, k) {
        var nv = merged[k];
        if (board[p[0]][p[1]] !== nv) moved = true;
        board[p[0]][p[1]] = nv;
      });
    });

    if (!moved) return;

    addTile();
    render();
    busy = true;
    setTimeout(function () { busy = false; }, 90);

    if (won) {
      won = false;
      showOverlay("凑到 2048 了", "这一局 " + score + " 分，还能接着玩", "继续");
      return;
    }
    if (!canMove()) {
      over = true;
      showOverlay("走不动了", "这一局 " + score + " 分", "重新开始");
    }
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++) {
        var v = board[r][c];
        if (c + 1 < SIZE && board[r][c + 1] === v) return true;
        if (r + 1 < SIZE && board[r + 1][c] === v) return true;
      }
    return false;
  }

  function showOverlay(title, text, btnText) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnText;
    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function reset() {
    board = blank();
    score = 0;
    won = false;
    over = false;
    busy = false;
    best = readBest();
    newAt = [];
    mergedAt = [];
    hideOverlay();
    addTile();
    addTile();
    render();
  }

  document.addEventListener("keydown", function (e) {
    var map = {
      ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
      a: "left", d: "right", w: "up", s: "down"
    };
    var dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  document.querySelectorAll(".pad button").forEach(function (b) {
    b.addEventListener("click", function () { move(b.dataset.dir); });
  });

  var startX = null, startY = null;
  elBoard.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    startX = t.clientX;
    startY = t.clientY;
  }, { passive: true });

  elBoard.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    startX = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  }, { passive: true });

  elBoard.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  document.getElementById("restart").addEventListener("click", reset);
  ovBtn.addEventListener("click", function () {
    if (ovBtn.textContent === "继续") {
      hideOverlay();
      over = false;
    } else {
      reset();
    }
  });

  reset();
})();
</script>

</body>
</html>
