<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>赞助作者 · RK的小游戏合集</title>
<meta name="description" content="如果您觉得有趣好玩的话，不妨请作者喝杯奶茶？">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .sponsor {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 18px;
    padding-bottom: 6vh;
  }
  .sponsor-line {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.9;
    letter-spacing: .04em;
    color: var(--ink);
    max-width: 17em;
  }
  .sponsor-qr {
    display: block;
    width: 200px;
    height: auto;
    padding: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 2px;
    box-shadow: 0 12px 26px -20px rgba(43, 37, 51, .8);
  }
  .sponsor-tip {
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: .08em;
  }
</style>
</head>
<body>

<div class="page page--game">

  <header class="game-top">
    <a class="back" href="../index.html">← 返回</a>
    <span class="game-title">赞助作者</span>
    <span class="game-tag">SPONSOR</span>
  </header>

  <main class="sponsor">
    <p class="sponsor-line">如果您觉得有趣好玩的话，<br>不妨请作者喝杯奶茶？</p>
    <img class="sponsor-qr" src="../assets/img/pay.png" alt="微信赞赏码" width="200" height="196" decoding="async">
    <p class="sponsor-tip">微信扫码 · 一分也是爱</p>
  </main>

</div>

</body>
</html>
