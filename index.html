<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>RK的小游戏合集</title>
<meta name="description" content="23 个纯静态网页小游戏：俄罗斯方块、贪吃蛇、扫雷、五子棋、2048、乒乓、推箱子、24 点等，点开即玩。">
<meta property="og:type" content="website">
<meta property="og:title" content="RK的小游戏合集">
<meta property="og:description" content="23 个纯静态网页小游戏，点开即玩。">
<meta property="og:image" content="https://zhanjhe.github.io/online-games/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/css/site.css">
<script>
/* 老的塔罗分享链接是根路径加 ?r=牌面，转发到新地址，别让旧链接失效 */
(function () {
  var r = new URLSearchParams(location.search).get("r");
  if (r) location.replace("tarot/index.html?r=" + encodeURIComponent(r));
})();
</script>
</head>
<body>

<div class="page page--home">

  <header class="home-top">
    <div class="home-kicker">MINI GAMES</div>
    <h1 class="home-title">RK的小游戏合集</h1>
    <p class="home-sub"><span id="gameCount">23</span> 个小游戏，点开即玩</p>
    <div class="home-rule"><span>✷</span></div>
  </header>

  <main class="home-main">

    <div class="home-tools">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/>
        </svg>
        <input id="q" type="search" placeholder="搜游戏：棋、数字、方块…" aria-label="搜索小游戏" autocomplete="off" spellcheck="false">
      </div>
      <div class="cats" id="cats" role="group" aria-label="按分类筛选"></div>
    </div>

    <p class="find-hint" id="findHint" aria-live="polite" hidden></p>

    <div class="grid" id="grid"></div>

    <p class="empty" id="empty" hidden>没有找到，换个词试试</p>

    <noscript><p class="empty">开启 JavaScript 后显示游戏卡片。</p></noscript>

  </main>

  <footer class="home-foot">
    纯静态页面，没有后端、没有广告、没有埋点 · 仅供娱乐
  </footer>

</div>

<script src="assets/data/games.js"></script>
<script>
(function () {
  "use strict";

  var games = window.GAMES || [];
  var cats = window.CATS || [{ id: "all", name: "全部" }];
  var grid = document.getElementById("grid");
  var catsEl = document.getElementById("cats");
  var input = document.getElementById("q");
  var hint = document.getElementById("findHint");
  var empty = document.getElementById("empty");
  var countEl = document.getElementById("gameCount");

  var state = { q: "", cat: "all" };

  var gameCount = games.filter(function (g) { return g.cat !== "sponsor"; }).length;
  countEl.textContent = String(gameCount);

  function catName(id) {
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i].name;
    return "";
  }

  function haystack(g) {
    return [g.name, g.desc, g.tag, catName(g.cat), (g.keywords || []).join(" ")]
      .join(" ").toLowerCase();
  }

  function cardHTML(g, i) {
    return '<a class="card" href="' + g.href + '" style="--i:' + i + '; --accent:' + g.accent + '">' +
      '<span class="card-tag">' + g.tag + '</span>' +
      '<span class="card-icon">' + g.icon + '</span>' +
      '<span class="card-name">' + g.name + '</span>' +
      '<span class="card-desc">' + g.desc + '</span>' +
      '</a>';
  }

  function matches(g) {
    if (g.cat === "sponsor") return state.cat === "all" && !state.q;
    if (state.cat !== "all" && g.cat !== state.cat) return false;
    if (!state.q) return true;
    return haystack(g).indexOf(state.q) !== -1;
  }

  function render() {
    var list = games.filter(matches);
    var shown = 0;
    var idx = 0;
    var html = "";
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      if (g.cat !== "sponsor") shown++;
      html += cardHTML(g, idx);
      idx++;
    }
    grid.innerHTML = html;

    var filtering = !!state.q || state.cat !== "all";
    hint.hidden = !filtering;
    hint.textContent = filtering ? "找到 " + shown + " 个" : "";
    empty.hidden = shown !== 0;
  }

  function syncChips() {
    var buttons = catsEl.querySelectorAll(".cat");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", buttons[i].dataset.cat === state.cat ? "true" : "false");
    }
  }

  cats.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cat";
    b.dataset.cat = c.id;
    b.textContent = c.name;
    b.setAttribute("aria-pressed", c.id === state.cat ? "true" : "false");
    b.addEventListener("click", function () {
      state.cat = c.id;
      syncChips();
      render();
    });
    catsEl.appendChild(b);
  });

  input.addEventListener("input", function () {
    state.q = input.value.trim().toLowerCase();
    render();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      input.value = "";
      state.q = "";
      state.cat = "all";
      syncChips();
      render();
      return;
    }
    if (e.key === "Enter") {
      var first = grid.querySelector(".card");
      if (first) window.location.href = first.getAttribute("href");
    }
  });

  render();
})();
</script>

</body>
</html>
