<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>四子棋 · RK的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .c4-board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    width: min(350px, 90vw);
    padding: 8px;
    background: #4E6E8E;
    border-radius: 4px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .18);
  }
  .c4-cell {
    position: relative;
    padding: 0;
    border: 0;
    background: transparent;
    aspect-ratio: 1;
    cursor: pointer;
  }
  .c4-cell::before {
    content: "";
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    background: #F7F1E7;
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, .18);
  }
  .c4-cell.p1::before { background: #B4626B; box-shadow: inset 0 -2px 4px rgba(0, 0, 0, .2); }
  .c4-cell.p2::before { background: #D9A94E; box-shadow: inset 0 -2px 4px rgba(0, 0, 0, .2); }
  .c4-cell.win::before { outline: 2px solid #2B2533; outline-offset: -2px; }
  .c4-cell:hover::before { filter: brightness(.96); }
</style>
</head>
<body>

<script src="../assets/js/sfx.js"></script>
<script src="../assets/js/game-kit.js"></script>
<script>
(function () {
  "use strict";

  var COLS = 7, ROWS = 6;

  var g = GameKit.mount({
    id: "connect4",
    title: "四子棋",
    tag: "CONNECT 4",
    accent: "#4E6E8E",
    tip: "点一列落子，红你先、黄 AI 后 · 横竖斜连成四个就赢",
    hud: [
      { id: "streak", label: "连胜", value: "0" },
      { id: "best", label: "最好", value: "0" }
    ],
    actions: [{ id: "restart", label: "重开" }],
    stage: '<div class="c4-board" id="board"></div>'
  });

  var boardEl = g.$("#board");
  var grid = [];
  var cells = [];
  var over = false;
  var streak = 0;
  var best = g.best();

  g.setHud("best", best);

  for (var r = 0; r < ROWS; r++) {
    var row = [];
    for (var c = 0; c < COLS; c++) {
      row.push(0);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "c4-cell";
      b.dataset.col = c;
      b.setAttribute("aria-label", "第 " + (c + 1) + " 列");
      b.addEventListener("click", onCell);
      boardEl.appendChild(b);
      cells.push(b);
    }
    grid.push(row);
  }

  function paint() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var v = grid[r][c];
        var b = cells[r * COLS + c];
        b.className = "c4-cell" + (v === 1 ? " p1" : v === 2 ? " p2" : "");
      }
    }
  }

  function dropRow(c) {
    for (var r = ROWS - 1; r >= 0; r--) if (!grid[r][c]) return r;
    return -1;
  }

  function lineAt(r, c, p) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var d = 0; d < dirs.length; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var n = 1, cellsLine = [[r, c]];
      for (var s = 1; s < 5; s++) {
        var rr = r + dr * s, cc = c + dc * s;
        if (rr < 0 || cc < 0 || rr >= ROWS || cc >= COLS || grid[rr][cc] !== p) break;
        n++; cellsLine.push([rr, cc]);
      }
      for (var s2 = 1; s2 < 5; s2++) {
        var r2 = r - dr * s2, c2 = c - dc * s2;
        if (r2 < 0 || c2 < 0 || r2 >= ROWS || c2 >= COLS || grid[r2][c2] !== p) break;
        n++; cellsLine.unshift([r2, c2]);
      }
      if (n >= 4) return cellsLine;
    }
    return null;
  }

  function full() {
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (!grid[r][c]) return false;
    return true;
  }

  function finish(winner, line) {
    over = true;
    if (line) line.forEach(function (p) { cells[p[0] * COLS + p[1]].classList.add("win"); });
    if (winner === 1) {
      streak++;
      if (streak > best) { best = streak; g.saveBest(best); g.setHud("best", best); }
      g.sound("win");
    } else if (winner === 2) {
      streak = 0;
      g.sound("lose");
    } else {
      streak = 0;
      g.sound("miss");
    }
    g.setHud("streak", streak);
    g.show(winner === 1 ? "你赢了" : winner === 2 ? "AI 赢了" : "平局",
      "连胜 " + streak + " · 最好 " + best, "再来一局");
  }

  function drop(c, p) {
    var r = dropRow(c);
    if (r < 0) return false;
    grid[r][c] = p;
    paint();
    var line = lineAt(r, c, p);
    if (line) finish(p, line);
    else if (full()) finish(0, null);
    return true;
  }

  function onCell(e) {
    if (over) return;
    var c = parseInt(e.currentTarget.dataset.col, 10);
    if (dropRow(c) < 0) return;
    g.sound("place");
    if (drop(c, 1)) {
      if (over) return;
      setTimeout(aiTurn, 320);
    }
  }

  function aiTurn() {
    if (over) return;
    var valid = [];
    for (var c = 0; c < COLS; c++) if (dropRow(c) >= 0) valid.push(c);
    if (!valid.length) return;

    var pick = null;
    for (var i = 0; i < valid.length; i++) {
      var cc = valid[i], rr = dropRow(cc);
      grid[rr][cc] = 2;
      if (lineAt(rr, cc, 2)) pick = cc;
      grid[rr][cc] = 0;
      if (pick !== null) break;
    }
    if (pick === null) {
      for (var j = 0; j < valid.length; j++) {
        var c2 = valid[j], r2 = dropRow(c2);
        grid[r2][c2] = 1;
        if (lineAt(r2, c2, 1)) pick = c2;
        grid[r2][c2] = 0;
        if (pick !== null) break;
      }
    }
    if (pick === null) {
      var order = [3, 2, 4, 1, 5, 0, 6];
      for (var k = 0; k < order.length; k++) {
        if (valid.indexOf(order[k]) !== -1) { pick = order[k]; break; }
      }
    }
    g.sound("place");
    drop(pick, 2);
  }

  function reset() {
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) grid[r][c] = 0;
    over = false;
    paint();
    g.hide();
  }

  g.$("#restart").addEventListener("click", reset);
  g.onOverlay(reset);

  paint();
})();
</script>

</body>
</html>
