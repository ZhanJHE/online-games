<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>记忆翻牌 · RK的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  :root { --accent: #7E7BA6; }

  .mem-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 320px;
    max-width: 80vw;
    aspect-ratio: 1;
  }

  .mem-card {
    position: relative;
    display: block;
    aspect-ratio: 1;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    perspective: 600px;
  }

  .mem-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .34s cubic-bezier(.16, 1, .3, 1);
    border-radius: 2px;
  }

  .mem-card.flipped .mem-inner,
  .mem-card.matched .mem-inner { transform: rotateY(180deg); }

  .mem-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    border-radius: 2px;
    border: 1px solid var(--line);
    font-size: 26px;
    line-height: 1;
  }

  .mem-back {
    background: #2B2533;
    color: #C9A96A;
    font-size: 18px;
  }
  .mem-back::after { content: "✷"; }

  .mem-front {
    background: var(--card);
    color: var(--ink);
    transform: rotateY(180deg);
    font-size: 28px;
  }

  .mem-card.matched .mem-front {
    border-color: var(--gold);
    background: #FBF3E2;
    color: var(--gold);
  }

  .mem-card.done { pointer-events: none; }

  @media (max-width: 420px) {
    .mem-face { font-size: 22px; }
    .mem-front { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="page page--game">
  <header class="game-top">
    <a class="back" href="../index.html">← 返回</a>
    <span class="game-title">记忆翻牌</span>
    <span class="game-tag">MEMORY</span>
  </header>

  <div class="hud">
    <span>步数<b id="moves">0</b></span>
    <span>用时<b id="time">0</b></span>
    <span>最好<b id="best">—</b></span>
    <button class="btn btn-sm ghost" id="restart" type="button">重开</button>
  </div>

  <main class="game-main">
    <div class="stage">
      <div class="mem-board" id="board"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="ovTitle">全配上了</div>
          <div class="overlay-text" id="ovText"></div>
          <button class="btn" id="ovBtn" type="button">再来一局</button>
        </div>
      </div>
    </div>
  </main>

  <p class="game-tip">点两张牌，图案一样就配对成功 · 全部配完算赢</p>
</div>

<script>
(function () {
  "use strict";

  /* 想换图案改这里，必须成对出现（现在是 8 对 16 张） */
  var SYMBOLS = ["☾", "☀", "★", "✦", "♥", "♣", "✿", "☂"];

  var elBoard = document.getElementById("board");
  var elMoves = document.getElementById("moves");
  var elTime = document.getElementById("time");
  var elBest = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var ovText = document.getElementById("ovText");
  var ovBtn = document.getElementById("ovBtn");

  var deck = [];
  var first = null;
  var matched = 0;
  var moves = 0;
  var locked = false;
  var started = 0;
  var timerId = null;

  function readBest() {
    try { return parseInt(localStorage.getItem("memory.best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("memory.best", String(v)); } catch (e) {}
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderBest() {
    var b = readBest();
    elBest.textContent = b ? b : "—";
  }

  function build() {
    deck = shuffle(SYMBOLS.concat(SYMBOLS).map(function (s, i) {
      return { id: i, sym: s, matched: false };
    }));

    first = null;
    matched = 0;
    moves = 0;
    locked = false;
    started = 0;
    elMoves.textContent = "0";
    elTime.textContent = "0";
    overlay.classList.remove("show");

    elBoard.innerHTML = "";
    deck.forEach(function (card, idx) {
      var b = document.createElement("div");
      b.className = "mem-card";
      b.setAttribute("role", "button");
      b.tabIndex = 0;
      b.dataset.idx = String(idx);
      b.innerHTML =
        '<span class="mem-inner">' +
          '<span class="mem-face mem-back"></span>' +
          '<span class="mem-face mem-front">' + card.sym + '</span>' +
        '</span>';
      b.addEventListener("click", function () { flip(idx, b); });
      b.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          flip(idx, b);
        }
      });
      elBoard.appendChild(b);
    });
    renderBest();
  }

  function startTimer() {
    if (timerId) return;
    started = Date.now();
    timerId = setInterval(function () {
      elTime.textContent = Math.floor((Date.now() - started) / 1000);
    }, 500);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function flip(idx, btn) {
    if (locked || btn.classList.contains("flipped") || btn.classList.contains("matched")) return;
    if (!started) startTimer();

    btn.classList.add("flipped");

    if (first === null) {
      first = { idx: idx, el: btn };
      return;
    }

    moves++;
    elMoves.textContent = moves;
    locked = true;

    if (deck[first.idx].sym === deck[idx].sym) {
      deck[first.idx].matched = true;
      deck[idx].matched = true;
      first.el.classList.add("matched");
      btn.classList.add("matched");
      matched++;
      locked = false;
      first = null;

      if (matched === SYMBOLS.length) finish();
    } else {
      var a = first.el, b = btn;
      first = null;
      setTimeout(function () {
        a.classList.remove("flipped");
        b.classList.remove("flipped");
        locked = false;
      }, 720);
    }
  }

  function finish() {
    stopTimer();
    var secs = Math.floor((Date.now() - started) / 1000);
    var best = readBest();
    var isBest = !best || moves < best;
    if (isBest) saveBest(moves);
    renderBest();
    ovText.textContent = "用了 " + moves + " 步、" + secs + " 秒" + (isBest ? "，创了自己的纪录" : "");
    overlay.classList.add("show");
  }

  document.getElementById("restart").addEventListener("click", function () {
    stopTimer();
    build();
  });
  ovBtn.addEventListener("click", function () {
    stopTimer();
    build();
  });

  build();
})();
</script>

</body>
</html>
