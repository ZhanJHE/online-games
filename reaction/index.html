<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>反应灯 · RK的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .rc-pad {
    width: min(320px, 84vw);
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--card);
    color: var(--ink-2);
    font: inherit;
    font-size: 15px;
    letter-spacing: .08em;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease, transform .12s ease;
  }
  .rc-pad.wait { background: #E9E1D4; }
  .rc-pad.go { background: #7F8C4A; border-color: #7F8C4A; color: #F7F1E7; }
  .rc-pad.early { background: #B4626B; border-color: #B4626B; color: #F7F1E7; }
  .rc-pad:active { transform: scale(.985); }
</style>
</head>
<body>

<script src="../assets/js/sfx.js"></script>
<script src="../assets/js/game-kit.js"></script>
<script>
(function () {
  "use strict";

  var ROUNDS = 5;

  var g = GameKit.mount({
    id: "reaction",
    title: "反应灯",
    tag: "REACTION",
    accent: "#7F8C4A",
    tip: "等灯变绿再点 · 抢跑要重来 · 一共 5 轮，取平均",
    hud: [
      { id: "last", label: "本轮", value: "—" },
      { id: "best", label: "最好", value: "—" }
    ],
    actions: [{ id: "restart", label: "重开" }],
    stage: '<button class="rc-pad" id="pad" type="button"><span id="padLabel">点开始</span></button>'
  });

  var pad = g.$("#pad");
  var label = g.$("#padLabel");
  var results = [];
  var running = false;
  var armed = false;
  var goTimer = null;
  var goAt = 0;
  var best = parseInt(g.get("reaction.best", "0"), 10) || 0;

  g.setHud("best", best ? best + " ms" : "—");

  function schedule() {
    armed = false;
    pad.className = "rc-pad wait";
    label.textContent = "等灯变绿…";
    clearTimeout(goTimer);
    goTimer = setTimeout(function () {
      goTimer = null;
      if (!running) return;
      armed = true;
      goAt = performance.now();
      pad.className = "rc-pad go";
      label.textContent = "点！";
      g.sound("tick");
    }, 1200 + Math.random() * 1800);
  }

  function start() {
    results = [];
    running = true;
    resetHud();
    g.hide();
    schedule();
  }

  function resetHud() {
    g.setHud("last", "—");
    g.setHud("best", best ? best + " ms" : "—");
  }

  function finish() {
    running = false;
    clearTimeout(goTimer);
    var sum = results.reduce(function (a, b) { return a + b; }, 0);
    var avg = Math.round(sum / results.length);
    if (!best || avg < best) {
      best = avg;
      g.saveBest(best);
      g.setHud("best", best + " ms");
    }
    g.sound("win");
    pad.className = "rc-pad wait";
    label.textContent = "平均 " + avg + " ms";
    g.show(avg + " ms", "5 轮：" + results.join(" / ") + " · 最好 " + best + " ms", "再来一次");
  }

  pad.addEventListener("click", function () {
    if (!running) return;
    if (!armed) {
      if (!goTimer) return;
      clearTimeout(goTimer);
      goTimer = null;
      g.sound("miss");
      pad.className = "rc-pad early";
      label.textContent = "抢跑了，等一下";
      setTimeout(function () { if (running) schedule(); }, 900);
      return;
    }

    armed = false;
    var ms = Math.round(performance.now() - goAt);
    results.push(ms);
    g.setHud("last", ms + " ms");
    g.sound("match");
    pad.className = "rc-pad wait";
    label.textContent = ms + " ms · 第 " + results.length + " / " + ROUNDS + " 轮";
    if (results.length >= ROUNDS) finish();
    else setTimeout(function () { if (running) schedule(); }, 650);
  });

  function restart() { start(); }

  g.$("#restart").addEventListener("click", restart);
  g.onOverlay(restart);
  g.show("反应灯", "灯变绿再点，一共 5 轮", "开始");
})();
</script>

</body>
</html>
