<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F1E7">
<title>贪吃蛇 · RK的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B2533'/%3E%3Cpath d='M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23C9A96A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  :root { --accent: #5D7F6A; }

  #board {
    display: block;
    width: 280px;
    max-width: 78vw;
    height: auto;
    aspect-ratio: 1;
    background: #FBF7EF;
  }
</style>
</head>
<body>

<div class="page page--game">
  <header class="game-top">
    <a class="back" href="../index.html">← 返回</a>
    <span class="game-title">贪吃蛇</span>
    <span class="game-tag">SNAKE</span>
  </header>

  <div class="hud">
    <span>分数<b id="score">0</b></span>
    <span>最高<b id="best">0</b></span>
    <button class="btn btn-sm ghost" id="restart" type="button">重开</button>
  </div>

  <main class="game-main">
    <div class="stage">
      <canvas id="board" width="280" height="280" aria-label="贪吃蛇棋盘"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="ovTitle">撞上了</div>
          <div class="overlay-text" id="ovText"></div>
          <button class="btn" id="ovBtn" type="button">再来一局</button>
        </div>
      </div>
    </div>

    <div class="pad pad-3">
      <span class="spacer"></span>
      <button data-dir="up" type="button" aria-label="上">↑</button>
      <span class="spacer"></span>
      <button data-dir="left" type="button" aria-label="左">←</button>
      <button data-dir="down" type="button" aria-label="下">↓</button>
      <button data-dir="right" type="button" aria-label="右">→</button>
    </div>
  </main>

  <p class="game-tip">方向键或 WASD 转向 · 吃到红点变长 · 别撞墙、别咬到自己</p>
</div>

<script src="../assets/js/sfx.js"></script>
<script>
(function () {
  "use strict";

  var N = 20, CELL = 14;
  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = N * CELL * dpr;
  canvas.height = N * CELL * dpr;
  canvas.style.width = N * CELL + "px";
  ctx.scale(dpr, dpr);

  var snake, dir, queue, food, score, best, alive, stepMs, acc, last;

  var elScore = document.getElementById("score");
  var elBest = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var ovText = document.getElementById("ovText");
  var ovBtn = document.getElementById("ovBtn");

  function readBest() {
    try { return parseInt(localStorage.getItem("snake.best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("snake.best", String(v)); } catch (e) {}
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < N; y++)
      for (var x = 0; x < N; x++) {
        var hit = snake.some(function (s) { return s.x === x && s.y === y; });
        if (!hit) free.push({ x: x, y: y });
      }
    if (!free.length) return;
    food = free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    best = readBest();
    alive = true;
    stepMs = 140;
    acc = 0;
    last = 0;
    placeFood();
    overlay.classList.remove("show");
    elScore.textContent = "0";
    elBest.textContent = best;
    draw();
  }

  function turn(nx, ny) {
    var ref = queue.length ? queue[queue.length - 1] : dir;
    // 不允许 180 度掉头
    if (ref.x === -nx && ref.y === -ny) return;
    if (ref.x === nx && ref.y === ny) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die("撞墙了");

    var bodyHit = snake.some(function (s, i) {
      if (i === snake.length - 1) return false; // 尾巴会让开
      return s.x === head.x && s.y === head.y;
    });
    if (bodyHit) return die("咬到自己了");

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      SFX.play("eat");
      elScore.textContent = score;
      if (score > best) { best = score; saveBest(best); elBest.textContent = best; }
      stepMs = Math.max(70, 140 - Math.floor(score / 50) * 8);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die(reason) {
    alive = false;
    SFX.play("lose");
    ovText.textContent = reason + " · 这一局 " + score + " 分";
    overlay.classList.add("show");
  }

  function draw() {
    ctx.fillStyle = "#FBF7EF";
    ctx.fillRect(0, 0, N * CELL, N * CELL);

    ctx.strokeStyle = "rgba(43,37,51,.08)";
    ctx.lineWidth = 1;
    for (var i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, N * CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(N * CELL, i * CELL + .5); ctx.stroke();
    }

    if (food) {
      ctx.fillStyle = "#B4626B";
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.31, 0, Math.PI * 2);
      ctx.fill();
    }

    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? "#2B2533" : "#5D5748";
      var pad = i === 0 ? 1.5 : 2;
      ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    });

    if (snake.length) {
      ctx.fillStyle = "#C9A96A";
      var h = snake[0];
      ctx.fillRect(h.x * CELL + CELL / 2 - 2, h.y * CELL + CELL / 2 - 2, 4, 4);
    }
  }

  function loop(ts) {
    if (!last) last = ts;
    var dt = ts - last;
    last = ts;
    if (dt > 200) dt = 200;

    if (alive) {
      acc += dt;
      while (acc >= stepMs) {
        acc -= stepMs;
        step();
        if (!alive) break;
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  var KEYMAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  document.addEventListener("keydown", function (e) {
    var k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    turn(k[0], k[1]);
  });

  document.querySelectorAll(".pad button").forEach(function (b) {
    b.addEventListener("click", function () {
      var d = b.dataset.dir;
      if (d === "up") turn(0, -1);
      else if (d === "down") turn(0, 1);
      else if (d === "left") turn(-1, 0);
      else turn(1, 0);
    });
  });

  document.getElementById("restart").addEventListener("click", reset);
  ovBtn.addEventListener("click", reset);

  reset();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
